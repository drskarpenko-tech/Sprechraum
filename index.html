<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: one-column learning app, bottom tab bar, large type for a reader over 50. Palette from a warehouse floor: slate concrete, signal orange, safety green. */
:root {
  --bg: #f3f1ec; --surface: #ffffff; --surface-2: #e9e6df; --fg: #1c1f24; --muted: #5c6370; --line: #d6d2c8;
  --accent: #d9541b; --accent-fg: #ffffff; --accent-soft: #fbe6da;
  --ok: #2e7d4f; --ok-soft: #dff1e5; --warn: #b7791f; --warn-soft: #fbefd6; --bad: #b3261e; --bad-soft: #f9dedc;
  --me: #e3ecf7; --other: #ffffff;
  --display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", Roboto, system-ui, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15171b; --surface: #1f2228; --surface-2: #2a2e36; --fg: #eceae4; --muted: #a0a6b1; --line: #363b45;
  --accent: #f0702f; --accent-fg: #1a1208; --accent-soft: #3a2518;
  --ok: #6fcf97; --ok-soft: #1e3a2a; --warn: #e4b05a; --warn-soft: #3a2f16; --bad: #f28b82; --bad-soft: #42201e;
  --me: #22314a; --other: #1f2228; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #15171b; --surface: #1f2228; --surface-2: #2a2e36; --fg: #eceae4; --muted: #a0a6b1; --line: #363b45;
  --accent: #f0702f; --accent-fg: #1a1208; --accent-soft: #3a2518;
  --ok: #6fcf97; --ok-soft: #1e3a2a; --warn: #e4b05a; --warn-soft: #3a2f16; --bad: #f28b82; --bad-soft: #42201e;
  --me: #22314a; --other: #1f2228; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 18px; line-height: 1.5; }
#app { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 110px; min-width: 0; }
h1 { font-family: var(--display); font-size: 2.3rem; line-height: 1.05; margin: 8px 0 6px; text-wrap: balance; letter-spacing: .01em; }
h2.cat { font-family: var(--display); font-size: 1.35rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 26px 0 10px; }
h3 { font-family: var(--display); font-size: 1.4rem; margin: 0 0 8px; letter-spacing: .01em; }
p { margin: 0 0 10px; }
.lead { color: var(--muted); font-size: 1.05rem; max-width: 60ch; }
.eyebrow { font-size: .8rem; text-transform: uppercase; letter-spacing: .1em; color: var(--accent); font-weight: 700; margin-bottom: 4px; }
.hint { color: var(--muted); font-size: .95rem; }
.hint.warn { background: var(--warn-soft); color: var(--fg); border-left: 4px solid var(--warn); padding: 10px 12px; border-radius: 8px; }
.roles { font-size: .9rem; color: var(--muted); }
.hero { padding: 10px 0 6px; }
.hero h1 { font-size: 3rem; }

/* buttons */
.btn { font: inherit; font-weight: 700; font-size: 1rem; padding: 12px 18px; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; min-height: 48px; }
.btn:hover { border-color: var(--fg); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.mic { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn.mic.rec { background: var(--bad); border-color: var(--bad); color: #fff; animation: pulse 1s infinite; }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.g0 { border-color: var(--bad); color: var(--bad); } .btn.g1 { border-color: var(--warn); color: var(--warn); } .btn.g2 { border-color: var(--ok); color: var(--ok); }
.link { font: inherit; background: none; border: 0; color: var(--accent); font-weight: 700; cursor: pointer; padding: 8px 0; }
.link.small { font-size: .85rem; }
.icon-btn { font: inherit; font-size: 1.2rem; width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex: none; color: var(--fg); }
.icon-btn.big { width: 64px; height: 64px; font-size: 1.6rem; }
.icon-btn.speaking, .btn.speaking { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 var(--bad-soft); } 50% { box-shadow: 0 0 0 8px var(--bad-soft); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; scroll-behavior: auto !important; transition: none !important; } }

.ctl { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 12px 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.chip { font: inherit; font-size: .95rem; padding: 8px 14px; border-radius: 999px; border: 2px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; min-height: 40px; }
.chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.rate { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.rate-l { font-size: .85rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-right: 4px; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

/* stats + plan */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 14px 0; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; min-width: 0; }
.stat .num { font-family: var(--display); font-size: 2.2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .of { font-size: 1rem; color: var(--muted); font-family: var(--body); }
.stat .lbl { font-size: .85rem; color: var(--muted); margin-top: 4px; }
.plan { display: grid; gap: 10px; margin: 16px 0; }
.step { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.step.done { opacity: .75; }
.step-n { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; font-family: var(--display); font-size: 1.5rem; }
.step.done .step-n { background: var(--ok); color: #fff; }
.step-t { font-weight: 700; font-size: 1.1rem; } .step-s { color: var(--muted); font-size: .95rem; }
.step-body { min-width: 0; }
@media (max-width: 460px) { .step { grid-template-columns: 44px 1fr; } .step .btn { grid-column: 2; justify-self: start; } }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin: 14px 0; min-width: 0; }
.card.tip ul { margin: 0; padding-left: 20px; } .card.tip li { margin-bottom: 6px; }
.card.warn { border-color: var(--warn); background: var(--warn-soft); }
.card.grammar { border-left: 5px solid var(--accent); }

/* lists */
.list { display: grid; gap: 8px; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; font: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; color: var(--fg); cursor: pointer; min-width: 0; }
.row:not(.static):hover { border-color: var(--accent); }
.row.static { cursor: default; }
.row-emoji { font-size: 1.6rem; flex: none; width: 36px; text-align: center; }
.row-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.row-t { font-weight: 700; font-size: 1.05rem; } .row-s { color: var(--muted); font-size: .9rem; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.badge { font-size: .8rem; padding: 3px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.badge.ok { background: var(--ok-soft); color: var(--ok); font-weight: 700; }

/* dialog */
.dialog { display: grid; gap: 10px; margin: 12px 0; }
.line { display: grid; grid-template-columns: 34px 1fr 46px; gap: 8px; align-items: start; }
.who { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-size: 1.1rem; background: var(--surface-2); color: var(--muted); margin-top: 4px; }
.line.me .who { background: var(--accent); color: var(--accent-fg); }
.bubble { background: var(--other); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; min-width: 0; }
.line.me .bubble { background: var(--me); }
.line.speaking .bubble { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.de { font-size: 1.15rem; font-weight: 700; }
.ru { color: var(--muted); font-size: .98rem; margin-top: 2px; }
.xl { font-size: 1.5rem; line-height: 1.3; }
.ru.xl { color: var(--fg); font-weight: 400; }
.masked { display: none; color: var(--muted); font-style: italic; }
.line.hidden-text:not(.reveal) .de, .line.hidden-text:not(.reveal) .ru { display: none; }
.line.hidden-text:not(.reveal) .masked { display: block; }
.line.hidden-text { cursor: pointer; }

/* quiz */
.q { margin: 12px 0; } .q-t { font-weight: 700; }
.opts { display: grid; gap: 8px; }
.opt { font: inherit; text-align: left; padding: 12px 14px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.big { font-family: var(--display); font-size: 1.9rem; margin: 6px 0; }
.big.good { color: var(--ok); } .big.mid { color: var(--warn); } .big.bad { color: var(--bad); }
.cmp .de { font-size: 1.25rem; }
.w-ok { color: var(--ok); } .w-miss { color: var(--bad); text-decoration: underline wavy; }

.input { font: inherit; font-size: 1.1rem; width: 100%; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--fg); min-width: 0; }
.input.big-inp { font-size: 2rem; font-family: var(--display); text-align: center; letter-spacing: .05em; }
.check { display: flex; gap: 10px; align-items: center; }
select.input { appearance: auto; }
.prog { font-size: .85rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-top: 10px; }
.speak-card { text-align: center; }
.speak-card .ctl, .speak-card .selfrate, .speak-card .grades { justify-content: center; }
.selfrate { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 10px 0; }
.grades { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.grades .btn { flex: 1; min-width: 110px; }
.mic-status { min-height: 1.4em; }

/* talk */
.topics { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.topic { font: inherit; text-align: left; display: flex; flex-direction: column; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; color: var(--fg); cursor: pointer; min-width: 0; }
.topic:hover, .topic.on { border-color: var(--accent); }
.chat { display: grid; gap: 10px; margin: 12px 0; }
.msg { max-width: 88%; padding: 10px 14px; border-radius: var(--radius); border: 1px solid var(--line); min-width: 0; }
.msg.bot { background: var(--other); justify-self: start; border-bottom-left-radius: 4px; }
.msg.user { background: var(--me); justify-self: end; border-bottom-right-radius: 4px; }
.msg .icon-btn { width: 36px; height: 36px; font-size: 1rem; margin-top: 6px; margin-right: 8px; }
.fix { background: var(--warn-soft); border-left: 4px solid var(--warn); border-radius: 8px; padding: 8px 12px; font-size: .95rem; }
.fix-l { color: var(--muted); }
.fix .icon-btn { width: 32px; height: 32px; font-size: .9rem; margin-left: 6px; }
.talk-ctl { position: sticky; bottom: 82px; background: var(--bg); padding: 8px 0; }
.talk-ctl .input { flex: 1; min-width: 160px; }

/* progress */
.days { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; height: 90px; align-items: end; }
.day { position: relative; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; background: var(--surface-2); border-radius: 6px; overflow: hidden; }
.day-bar { width: 100%; background: var(--line); min-height: 3px; }
.day.on .day-bar { background: var(--accent); } .day.hot .day-bar { background: var(--ok); }
.day-d { font-size: .7rem; color: var(--muted); position: absolute; top: 3px; font-variant-numeric: tabular-nums; }

/* nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: space-around; padding: 6px 4px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); z-index: 5; }
.nav button { font: inherit; font-size: .72rem; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: 0; color: var(--muted); padding: 6px 4px; border-radius: 10px; min-width: 56px; cursor: pointer; }
.nav button span { font-size: 1.4rem; }
.nav button.active { color: var(--accent); background: var(--accent-soft); }
</style>

// ===================== Хранилище =====================
const STORE_KEY = 'sprechraum_v1';
const DEFAULT_STATE = {
  name: '', rate: 0.8, voiceName: '', apiKey: '', showTextFirst: false,
  cards: {},            // id -> {box, due, seen, ok}
  scen: {},             // scenarioId -> {heard, quiz, spoken, dict}
  days: {},             // 'YYYY-MM-DD' -> {acts, min}
  talkTurns: 0,
};
let S = loadState();
function loadState() {
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) return Object.assign({}, DEFAULT_STATE, JSON.parse(raw)); } catch (e) {}
  return JSON.parse(JSON.stringify(DEFAULT_STATE));
}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {} }
function today() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function logAct(n) { const t = today(); S.days[t] = S.days[t] || { acts: 0 }; S.days[t].acts += (n || 1); save(); }
function streak() {
  let n = 0; const d = new Date();
  if (!S.days[today()]) d.setDate(d.getDate() - 1);
  for (;;) { const k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); if (S.days[k] && S.days[k].acts > 0) { n++; d.setDate(d.getDate() - 1); } else break; }
  return n;
}

// ===================== Карточки (все фразы) =====================
const ALL_SETS = [BASIS].concat(SCENARIOS);
const CARDS = [];
ALL_SETS.forEach(set => set.phrases.forEach((p, i) => CARDS.push({ id: set.id + ':' + i, set: set.id, setTitle: set.title, de: p.de, ru: p.ru })));
const INTERVALS = [0, 1, 3, 7, 14, 30, 60];
function cardState(id) { return S.cards[id] || { box: 0, due: 0, seen: 0, ok: 0 }; }
function dueCards() { const now = Date.now(); return CARDS.filter(c => { const st = cardState(c.id); return st.due <= now; }); }
function rateCard(id, grade) { // 0 = не знал, 1 = с трудом, 2 = легко
  const st = cardState(id); st.seen++;
  if (grade === 0) st.box = 0; else if (grade === 1) st.box = Math.max(1, st.box); else st.box = Math.min(INTERVALS.length - 1, st.box + 1);
  if (grade > 0) st.ok++;
  const days = INTERVALS[st.box]; st.due = Date.now() + (days === 0 ? 10 * 60 * 1000 : days * 864e5);
  S.cards[id] = st; logAct(1); save();
}
function knownCount() { return CARDS.filter(c => cardState(c.id).box >= 3).length; }

// ===================== Речь: синтез =====================
const synth = window.speechSynthesis;
let voices = [];
function loadVoices() { try { voices = synth ? synth.getVoices().filter(v => /^de/i.test(v.lang)) : []; } catch (e) { voices = []; } fillVoiceSelect(); }
if (synth) { loadVoices(); synth.onvoiceschanged = loadVoices; }
function pickVoice() {
  if (!voices.length) return null;
  if (S.voiceName) { const v = voices.find(v => v.name === S.voiceName); if (v) return v; }
  const pref = voices.find(v => /Google Deutsch|Anna|Petra|Katja|Helena|Vicki/i.test(v.name)) || voices.find(v => v.lang === 'de-DE') || voices[0];
  return pref;
}
let speakToken = 0;
function speak(text, rate) {
  return new Promise(resolve => {
    if (!synth) { resolve(false); return; }
    synth.cancel(); const my = ++speakToken;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'de-DE'; u.rate = rate || S.rate; u.pitch = 1;
    const v = pickVoice(); if (v) u.voice = v;
    u.onend = () => { if (my === speakToken) resolve(true); };
    u.onerror = () => resolve(false);
    document.querySelectorAll('.speaking').forEach(el => el.classList.remove('speaking'));
    synth.speak(u);
    // страховка от зависания синтеза в Chrome
    setTimeout(() => { if (my === speakToken && !synth.speaking) resolve(true); }, Math.max(4000, text.length * 120 / (rate || S.rate)));
  });
}
function stopSpeak() { if (synth) synth.cancel(); speakToken++; }

// ===================== Речь: распознавание =====================
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let micState = SR ? 'unknown' : 'none'; // unknown | ok | blocked | none
let recActive = null;
function listen(onInterim) {
  return new Promise((resolve, reject) => {
    if (!SR) { micState = 'none'; reject(new Error('nosr')); return; }
    stopSpeak();
    const r = new SR(); recActive = r;
    r.lang = 'de-DE'; r.interimResults = true; r.maxAlternatives = 3; r.continuous = false;
    let finalText = '', got = false;
    r.onresult = ev => {
      let interim = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++) { const t = ev.results[i][0].transcript; if (ev.results[i].isFinal) finalText += t; else interim += t; }
      if (onInterim) onInterim(finalText || interim);

  root.append(h('section', { class: 'card' }, h('h3', null, 'Ступени'), h('p', null, 'Ситуация считается «закрытой», когда ты её послушал, понял минимум 2 из 3 вопросов и сыграл роль. Фраза «в активе» — когда ты вспомнил её три раза с растущими интервалами. Это ближе к реальному умению, чем очки.')));
};

// ---------- Настройки ----------
VIEWS.settings = root => {
  root.append(h('h1', null, 'Настройки'));
  const name = h('input', { class: 'input', id: 'set-name', value: S.name, placeholder: 'Как к тебе обращаться (например, Alexander)' });
  name.addEventListener('change', () => { S.name = name.value.trim(); save(); });
  const sel = h('select', { class: 'input', id: 'set-voice' }); fillVoiceSelect(sel);
  sel.addEventListener('change', () => { S.voiceName = sel.value; save(); speak('Guten Tag! Ich bin deine Stimme.'); });
  const first = h('label', { class: 'check' }, h('input', { type: 'checkbox', id: 'set-text' }), ' Показывать текст диалога сразу (не рекомендуется)');
  first.querySelector('input').checked = S.showTextFirst; first.querySelector('input').addEventListener('change', e => { S.showTextFirst = e.target.checked; save(); });
  const key = h('input', { class: 'input', id: 'set-key', type: 'password', value: S.apiKey, placeholder: 'sk-ant-…' });
  key.addEventListener('change', () => { S.apiKey = key.value.trim(); save(); });
  root.append(
    h('section', { class: 'card' }, h('h3', null, 'Имя'), name),
    h('section', { class: 'card' }, h('h3', null, 'Голос диктора'), h('p', { class: 'hint' }, voices.length ? 'Доступные немецкие голоса этого устройства. В Chrome лучше всего «Google Deutsch».' : 'Немецкие голоса не найдены. В Android: Настройки → Язык → Синтез речи → установить немецкий. В Windows: Параметры → Время и язык → Речь → добавить Deutsch.'), sel, h('div', { class: 'ctl' }, rateCtl(), h('button', { class: 'btn', onclick: () => speak('Guten Tag! Heute bist du im Wareneingang.') }, '🔊 Проба'))),
    h('section', { class: 'card' }, h('h3', null, 'Диалоги'), first),
    h('section', { class: 'card' }, h('h3', null, 'ИИ-собеседник'), h('p', { class: 'hint' }, 'По ссылке claude.ai собеседник работает без ключа — просто разреши доступ при первом запросе. Если приложение открыто как файл в Chrome, нужен API-ключ Anthropic (console.anthropic.com). Ключ хранится только в этом браузере.'), key),
    h('section', { class: 'card' }, h('h3', null, 'Микрофон'), h('p', { class: 'hint' }, micState === 'none' ? 'Этот браузер не поддерживает распознавание речи. Используй Chrome на Android или на компьютере.' : micState === 'blocked' ? 'Распознавание заблокировано в этом окне. Сохрани файл и открой его в Chrome напрямую.' : 'Распознавание речи доступно. При первом нажатии «Говори» браузер спросит разрешение на микрофон.'), h('button', { class: 'btn', onclick: async ev => { ev.target.textContent = 'Скажи что-нибудь по-немецки…'; try { const t = await listen(); ev.target.textContent = t ? 'Услышал: „' + t + '“' : 'Ничего не услышал'; } catch (e) { ev.target.textContent = micState === 'blocked' ? 'Заблокировано в этом окне' : 'Ошибка: ' + e.message; } } }, '🎙 Проверить микрофон')),
    h('section', { class: 'card' }, h('h3', null, 'Данные'), h('p', { class: 'hint' }, 'Прогресс хранится только в этом браузере на этом устройстве.'), h('button', { class: 'btn danger', onclick: ev => { if (ev.target.dataset.sure) { localStorage.removeItem(STORE_KEY); S = loadState(); go('home'); } else { ev.target.dataset.sure = '1'; ev.target.textContent = 'Точно сбросить? Нажми ещё раз'; } } }, 'Сбросить прогресс')),
  );
};
function fillVoiceSelect(sel) {
  sel = sel || document.getElementById('set-voice'); if (!sel) return; sel.innerHTML = '';
  sel.append(h('option', { value: '' }, 'Автоматически'));
  voices.forEach(v => sel.append(h('option', { value: v.name }, v.name + ' (' + v.lang + ')')));
  sel.value = S.voiceName || '';
}

// ===================== Старт =====================
render();

</script>
